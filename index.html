<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Deck</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #000000;
      --surface: #171a20;
      --surface-2: #22252b;
      --surface-3: #2a2d34;
      --ink: #ffffff;
      --muted: #8e8e8e;
      --dim: #5c5e62;
      --line: #2c2f36;
      --blue: #3e6ae1;
      --blue-press: #2d58cc;
      --ok: #3dd68c;
      --warn: #f5a524;
      --bad: #e82127;
      --r: 8px;
      --touch: 72px;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; height: 100%; background: var(--bg); color: var(--ink);
      font-family: Inter, "Universal Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-weight: 400; letter-spacing: -0.01em; overflow: hidden; user-select: none;
    }
    body { display: flex; flex-direction: column; padding: 20px 24px 18px; gap: 16px; }
    header { display: flex; align-items: center; justify-content: space-between; min-height: 44px; flex-shrink: 0; }
    .brand { display: flex; align-items: baseline; gap: 10px; }
    .brand h1 { margin: 0; font-size: 15px; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); }
    .status { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); }
    .dot.live { background: var(--ok); box-shadow: 0 0 0 4px rgba(61, 214, 140, 0.15); }
    .dot.wait { background: var(--warn); }
    .dot.off { background: var(--bad); }
    .units { display: flex; background: var(--surface); border-radius: 6px; padding: 3px; }
    .units button { appearance: none; border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 14px; font-weight: 500; padding: 8px 16px; border-radius: 4px; min-height: 40px; }
    .units button.on { background: var(--surface-3); color: var(--ink); }
    main { flex: 1; display: grid; grid-template-rows: 1fr auto auto; gap: 16px; min-height: 0; }
    .hero { background: var(--surface); border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 12px 24px 20px; position: relative; min-height: 0; }
    .hero-label { position: absolute; top: 16px; left: 20px; font-size: 13px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: var(--dim); }
    .alt-wrap { display: flex; align-items: flex-end; gap: 14px; line-height: 0.85; }
    .alt { font-size: clamp(88px, 22vh, 168px); font-weight: 500; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; }
    .alt-unit { font-size: clamp(18px, 3.4vh, 28px); font-weight: 500; color: var(--muted); padding-bottom: 14px; letter-spacing: 0.04em; }
    .alt-meta { margin-top: 14px; display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 18px; color: var(--muted); font-size: 15px; }
    .alt-meta b { color: var(--ink); font-weight: 500; }
    .chips { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .chip { background: var(--surface); border-radius: var(--r); padding: 14px 16px 12px; min-height: 76px; }
    .chip .k { font-size: 12px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: var(--dim); margin-bottom: 6px; }
    .chip .v { font-size: 22px; font-weight: 500; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .chip .u { font-size: 13px; color: var(--muted); font-weight: 400; }
    .shortcuts-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    .shortcuts-head span { font-size: 12px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: var(--dim); }
    .shortcuts-head button { appearance: none; border: 0; background: transparent; color: var(--blue); font: inherit; font-size: 14px; font-weight: 500; padding: 8px 4px; }
    .shortcuts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .slot { appearance: none; border: 0; background: var(--surface); color: var(--ink); border-radius: var(--r); min-height: var(--touch); font: inherit; font-size: 16px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 0 12px; }
    .slot.empty { color: var(--dim); border: 1px dashed var(--line); background: transparent; }
    .slot:active { background: var(--surface-2); }
    .gate { position: absolute; inset: 0; background: rgba(0,0,0,0.72); display: none; align-items: center; justify-content: center; padding: 24px; }
    .gate.show { display: flex; }
    .gate-card { background: var(--surface); border-radius: 12px; padding: 28px 28px 24px; max-width: 420px; text-align: center; }
    .gate-card h2 { margin: 0 0 8px; font-size: 22px; font-weight: 500; }
    .gate-card p { margin: 0 0 20px; color: var(--muted); font-size: 15px; line-height: 1.45; }
    .cta { appearance: none; border: 0; background: var(--blue); color: #fff; font: inherit; font-size: 16px; font-weight: 500; border-radius: 4px; min-height: 52px; width: 100%; }
    .cta:active { background: var(--blue-press); }
    .modal { position: absolute; inset: 0; background: rgba(0,0,0,0.72); display: none; align-items: center; justify-content: center; padding: 24px; }
    .modal.show { display: flex; }
    .modal-card { background: var(--surface); border-radius: 12px; padding: 24px; width: min(520px, 100%); }
    .modal-card h2 { margin: 0 0 16px; font-size: 20px; font-weight: 500; }
    label { display: block; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--dim); margin: 12px 0 6px; }
    input { width: 100%; background: var(--bg); border: 1px solid var(--line); color: var(--ink); font: inherit; font-size: 16px; border-radius: 4px; padding: 14px 12px; outline: none; }
    input:focus { border-color: var(--blue); }
    .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
    .btn-ghost, .btn-danger { appearance: none; border: 0; font: inherit; font-size: 16px; font-weight: 500; border-radius: 4px; min-height: 48px; flex: 1; }
    .btn-ghost { background: var(--surface-3); color: var(--ink); }
    .btn-danger { background: transparent; color: var(--bad); }
    @media (max-height: 700px) {
      .alt { font-size: clamp(72px, 18vh, 120px); }
      .chip { min-height: 64px; padding: 10px 12px; }
      .chip .v { font-size: 18px; }
    }
    @media (max-width: 800px) {
      .chips, .shortcuts { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <h1>Deck</h1>
      <div class="status">
        <span class="dot" id="dot"></span>
        <span id="statusText">Waiting for GPS</span>
      </div>
    </div>
    <div class="units" role="group" aria-label="Units">
      <button id="btnM" class="on">m</button>
      <button id="btnFt">ft</button>
    </div>
  </header>
  <main>
    <section class="hero">
      <div class="hero-label">Altitude</div>
      <div class="alt-wrap">
        <div class="alt" id="alt">—</div>
        <div class="alt-unit" id="altUnit">m</div>
      </div>
      <div class="alt-meta">
        <span>GPS <b id="gpsAlt">—</b></span>
        <span>Terrain <b id="terrainAlt">—</b></span>
        <span>V/S <b id="vs">—</b></span>
        <span>Session <b id="session">—</b></span>
      </div>
    </section>
    <section class="chips">
      <div class="chip"><div class="k">Latitude</div><div class="v" id="lat">—</div></div>
      <div class="chip"><div class="k">Longitude</div><div class="v" id="lon">—</div></div>
      <div class="chip"><div class="k">Speed</div><div class="v" id="spd">—</div></div>
      <div class="chip"><div class="k">Heading</div><div class="v" id="hdg">—</div></div>
    </section>
    <section>
      <div class="shortcuts-head">
        <span>Shortcuts</span>
        <button type="button" id="editShortcuts">Edit</button>
      </div>
      <div class="shortcuts" id="shortcutRow"></div>
    </section>
  </main>
  <div class="gate" id="gate">
    <div class="gate-card">
      <h2 id="gateTitle">Enable location</h2>
      <p id="gateText">Safari only allows GPS after you tap. Allow location on the next prompt.</p>
      <button class="cta" id="askLoc" type="button">Enable location</button>
    </div>
  </div>
  <div class="modal" id="modal">
    <div class="modal-card">
      <h2 id="modalTitle">Shortcut</h2>
      <label for="scLabel">Label</label>
      <input id="scLabel" maxlength="18" placeholder="ABRP" />
      <label for="scUrl">URL</label>
      <input id="scUrl" placeholder="https://" inputmode="url" />
      <div class="modal-actions">
        <button class="btn-danger" id="scDelete" type="button">Remove</button>
        <button class="btn-ghost" id="scCancel" type="button">Cancel</button>
        <button class="cta" id="scSave" type="button" style="flex:1.2">Save</button>
      </div>
    </div>
  </div>
  <script src="app.js" defer></script>
</body>
</html>
